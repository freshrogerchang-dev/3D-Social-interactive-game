<!doctype html>
<html lang="zh-Hant-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <!-- iPhone「加入主畫面」的圖示（iOS 會自動裁圓角）；原圖 tools/icon/app-icon.svg。 -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>公園社交練習</title>
  </head>
  <body>
    <div id="app" class="app">
      <!-- 安全按鈕直接寫在 HTML，不依賴 WebGL 或場景初始化成功。 -->
      <div class="toolbar" role="toolbar" aria-label="隨時可用的按鈕">
        <button type="button" class="control" data-action="pause">
          <svg class="control-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <rect x="6" y="5" width="4" height="14" rx="1" />
            <rect x="14" y="5" width="4" height="14" rx="1" />
          </svg>
          <!-- zhuyin-slot：之後放人工標註的注音（03 §9.1）；空的時候不佔空間。 -->
          <span class="control-label"
            ><span class="label-text">暫停</span><span class="zhuyin-slot" aria-hidden="true"></span
          ></span>
        </button>
        <button type="button" class="control" data-action="safety">
          <svg class="control-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M12 4 3 11h2.5v8h5v-5h3v5h5v-8H21z" />
          </svg>
          <span class="control-label"
            ><span class="label-text">返回安全區</span
            ><span class="zhuyin-slot" aria-hidden="true"></span
          ></span>
        </button>
      </div>

      <div id="stage" class="stage" role="region" aria-label="公園場景"></div>

      <p id="status" class="status" role="status" aria-live="polite">正在準備公園…</p>

      <section id="overlay" class="overlay" aria-labelledby="overlay-title" hidden>
        <div class="panel">
          <h1 id="overlay-title" class="panel-title" aria-live="polite"></h1>
          <p id="overlay-text" class="panel-text"></p>
          <div class="panel-actions">
            <button type="button" class="control" data-action="resume" hidden>
              <span class="control-label"
                ><span class="label-text">繼續</span
                ><span class="zhuyin-slot" aria-hidden="true"></span
              ></span>
            </button>
            <button type="button" class="control" data-action="retry" hidden>
              <span class="control-label"
                ><span class="label-text">重試</span
                ><span class="zhuyin-slot" aria-hidden="true"></span
              ></span>
            </button>
            <button type="button" class="control" data-action="restart" hidden>
              <span class="control-label"
                ><span class="label-text">重新開始</span
                ><span class="zhuyin-slot" aria-hidden="true"></span
              ></span>
            </button>
            <button type="button" class="control control-quiet" data-action="end" hidden>
              <span class="control-label"
                ><span class="label-text">結束本次</span
                ><span class="zhuyin-slot" aria-hidden="true"></span
              ></span>
            </button>
          </div>
          <!-- voice-slot：之後放「再聽一次」語音按鈕（03 §9.3）。 -->
          <div class="voice-slot"></div>
        </div>
      </section>

      <button id="greeting-launch" type="button" class="control greeting-launch" hidden disabled>
        靠近再說話
      </button>
      <button id="practice-launch" type="button" class="control practice-launch" hidden>
        街區地圖
      </button>
      <p id="district-hint" class="district-hint" role="status" hidden></p>
      <section id="district-map" class="district-map" aria-labelledby="district-map-title" hidden>
        <div class="panel">
          <h2 id="district-map-title">街區地圖</h2>
          <p>北方在上。選擇地點只顯示指引，沿步道走近後再按開始。</p>
          <svg
            class="district-plan"
            viewBox="0 0 276 156"
            role="img"
            aria-label="左側公園，經東側步道到路口，對面有餐館和廁所，旁邊有休息角、見面處與公告牌"
          >
            <rect width="276" height="156" rx="8" fill="#eef0e7" />
            <rect x="12" y="30" width="96" height="96" fill="#bdceb8" />
            <path
              d="M108 78h60m0-66v132m36-132v132"
              stroke="#c8c2b2"
              stroke-width="14"
              fill="none"
            />
            <path d="M192 12v132" stroke="#7c8689" stroke-width="24" />
            <path d="M180 51h24" stroke="#f5f2e9" stroke-width="7" stroke-dasharray="3 2" />
            <rect x="222" y="27" width="36" height="36" fill="#b9c9cd" />
            <rect x="228" y="81" width="30" height="36" fill="#a8beb4" />
            <g fill="#647c91">
              <circle data-map-place="crossing" cx="168" cy="51" r="4" />
              <circle data-map-place="dining" cx="228" cy="45" r="4" />
              <circle data-map-place="toilet" cx="221" cy="99" r="4" />
              <circle data-map-place="sensory" cx="168" cy="114" r="4" />
              <circle data-map-place="boundary" cx="228" cy="132" r="4" />
              <circle data-map-place="changes" cx="215" cy="18" r="4" />
            </g>
            <g fill="#34453b" font-size="9">
              <text x="32" y="47">公園</text>
              <text x="22" y="142">北 ↑</text>
              <text x="151" y="43">路口</text>
              <text x="231" y="40">餐館</text>
              <text x="237" y="95">廁所</text>
              <text x="140" y="129">休息角</text>
              <text x="235" y="143">見面處</text>
              <text x="228" y="18">公告牌</text>
            </g>
            <circle
              id="map-player"
              cx="60"
              cy="99"
              r="4"
              fill="#344b72"
              stroke="#fff"
              stroke-width="2"
            />
            <path id="map-heading" d="M0 -9 -3 -4h6z" fill="#344b72" />
          </svg>
          <div class="map-destinations" role="group" aria-label="地點指引">
            <button class="control" type="button" data-destination="crossing">路口</button
            ><button class="control" type="button" data-destination="dining">餐館</button
            ><button class="control" type="button" data-destination="toilet">廁所</button
            ><button class="control" type="button" data-destination="sensory">休息角</button
            ><button class="control" type="button" data-destination="boundary">見面處</button
            ><button class="control" type="button" data-destination="changes">公告牌</button>
          </div>
          <button id="district-map-close" class="control" type="button">收起地圖</button>
        </div>
      </section>
      <section id="greeting-panel" class="greeting-panel" aria-labelledby="greeting-title" hidden>
        <div class="panel">
          <img id="practice-picture" class="practice-picture" alt="" hidden />
          <h2 id="greeting-title" class="panel-title">
            <svg class="control-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="M4 4h16v12H9l-5 4V4zm2 2v10l2-2h10V6H6z" />
            </svg>
            打招呼
          </h2>
          <p id="world-walk-title" hidden></p>
          <div id="greeting-copy" class="panel-text" tabindex="-1"></div>
          <div id="greeting-choices" class="panel-actions"></div>
          <div id="greeting-tools" class="panel-actions greeting-tools">
            <button type="button" class="control" data-greeting="help">幫助</button>
            <button type="button" class="control" data-greeting="again">再看一次</button>
          </div>
          <div id="greeting-help-panel" hidden>
            <p id="greeting-help" class="panel-text"></p>
            <button type="button" class="control" data-greeting="map">街區地圖</button>
            <button type="button" class="control" data-greeting="close-help">關閉幫助</button>
          </div>
        </div>
      </section>

      <div
        id="movement-pad"
        class="movement-pad"
        role="group"
        aria-label="移動與轉身搖桿"
        aria-describedby="joystick-help"
        hidden
      >
        <span class="pad-ring" aria-hidden="true"></span>
        <span class="pad-hint pad-hint-up" aria-hidden="true">▲</span>
        <span class="pad-hint pad-hint-down" aria-hidden="true">▼</span>
        <span class="pad-hint pad-hint-left" aria-hidden="true">↺</span>
        <span class="pad-hint pad-hint-right" aria-hidden="true">↻</span>
        <span class="pad-thumb" aria-hidden="true"></span>
      </div>
      <p id="joystick-help" class="visually-hidden">
        按住圓盤往上推前進、往下推後退，往左右推轉身，放開停止。也可以展開設定使用單次移動按鈕。
      </p>

      <p id="performance-info" class="performance-info" hidden>測量中…</p>

      <p id="npc-info" class="npc-info" hidden>公園裡有七個人，轉身看看。</p>

      <details id="movement-controls" class="movement-controls" hidden>
        <summary class="control" aria-label="操作與設定">設定</summary>
        <div class="movement-content">
          <label class="movement-setting"
            ><input id="npc-motion" type="checkbox" checked />人物動作</label
          >
          <label class="movement-setting"
            ><input id="voice-enabled" type="checkbox" checked />語音</label
          >
          <p id="movement-help">
            點地面前往，拖曳看向。左下搖桿：往上推前進、往下推後退、往左右推轉身，放開停止。電腦可先點公園，再用
            WASD 或方向鍵。
          </p>
          <div class="movement-buttons" role="group" aria-label="移動與看向">
            <button type="button" class="control" data-move="left">往左一步</button>
            <button type="button" class="control" data-move="right">往右一步</button>
            <button type="button" class="control" data-move="forward">往前一步</button>
            <button type="button" class="control" data-move="back">往後一步</button>
            <button type="button" class="control" data-move="turn-left">向左看</button>
            <button type="button" class="control" data-move="turn-right">向右看</button>
            <button type="button" class="control" data-move="stop">停止移動</button>
          </div>
          <label class="movement-setting"
            ><span
              ><input id="performance-check" type="checkbox" />顯示流暢度數字（FPS）</span
            ></label
          >
          <label class="movement-setting"
            >場景細節
            <select id="environment-detail" name="environment-detail">
              <option value="standard">標準</option>
              <option value="low">較少葉片</option>
            </select>
          </label>
          <label class="movement-setting"
            >移動速度（慢 → 快）<input
              type="range"
              name="speed"
              min="0.6"
              max="1.8"
              step="0.2"
              value="1"
          /></label>
          <label class="movement-setting"
            >轉向靈敏度（低 → 高）<input
              type="range"
              name="sensitivity"
              min="0.001"
              max="0.005"
              step="0.001"
              value="0.002"
          /></label>
          <label class="movement-setting"
            >視野（窄 → 廣）<input type="range" name="fov" min="50" max="75" step="5" value="60"
          /></label>
        </div>
      </details>

      <noscript>
        <p class="panel">這個練習需要開啟 JavaScript。</p>
      </noscript>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
