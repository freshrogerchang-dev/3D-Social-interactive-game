<!doctype html>
<html lang="zh-Hant-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="icon" href="data:," />
    <title>公園社交練習</title>
  </head>
  <body>
    <div id="app" class="app">
      <!-- 安全按鈕直接寫在 HTML，不依賴 WebGL 或場景初始化成功。 -->
      <div class="toolbar" role="toolbar" aria-label="隨時可用的按鈕">
        <button type="button" class="control" data-action="pause">
          <svg class="control-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <rect x="6" y="5" width="4" height="14" rx="1" />
            <rect x="14" y="5" width="4" height="14" rx="1" />
          </svg>
          <!-- zhuyin-slot：之後放人工標註的注音（03 §9.1）；空的時候不佔空間。 -->
          <span class="control-label"
            ><span class="label-text">暫停</span><span class="zhuyin-slot" aria-hidden="true"></span
          ></span>
        </button>
        <button type="button" class="control" data-action="safety">
          <svg class="control-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M12 4 3 11h2.5v8h5v-5h3v5h5v-8H21z" />
          </svg>
          <span class="control-label"
            ><span class="label-text">返回安全區</span
            ><span class="zhuyin-slot" aria-hidden="true"></span
          ></span>
        </button>
      </div>

      <div id="stage" class="stage" role="region" aria-label="公園場景"></div>

      <p id="status" class="status" role="status" aria-live="polite">正在準備公園…</p>

      <section id="overlay" class="overlay" aria-labelledby="overlay-title" hidden>
        <div class="panel">
          <h1 id="overlay-title" class="panel-title" aria-live="polite"></h1>
          <p id="overlay-text" class="panel-text"></p>
          <div class="panel-actions">
            <button type="button" class="control" data-action="resume" hidden>
              <span class="control-label"
                ><span class="label-text">繼續</span
                ><span class="zhuyin-slot" aria-hidden="true"></span
              ></span>
            </button>
            <button type="button" class="control" data-action="retry" hidden>
              <span class="control-label"
                ><span class="label-text">重試</span
                ><span class="zhuyin-slot" aria-hidden="true"></span
              ></span>
            </button>
            <button type="button" class="control" data-action="restart" hidden>
              <span class="control-label"
                ><span class="label-text">重新開始</span
                ><span class="zhuyin-slot" aria-hidden="true"></span
              ></span>
            </button>
            <button type="button" class="control control-quiet" data-action="end" hidden>
              <span class="control-label"
                ><span class="label-text">結束本次</span
                ><span class="zhuyin-slot" aria-hidden="true"></span
              ></span>
            </button>
          </div>
          <!-- voice-slot：之後放「再聽一次」語音按鈕（03 §9.3）。 -->
          <div class="voice-slot"></div>
        </div>
      </section>

      <button id="greeting-launch" type="button" class="control greeting-launch" hidden disabled>
        靠近再說話
      </button>
      <section id="greeting-panel" class="greeting-panel" aria-labelledby="greeting-title" hidden>
        <div class="panel">
          <h2 id="greeting-title" class="panel-title">
            <svg class="control-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="M4 4h16v12H9l-5 4V4zm2 2v10l2-2h10V6H6z" />
            </svg>
            打招呼
          </h2>
          <div id="greeting-copy" class="panel-text" tabindex="-1"></div>
          <div id="greeting-choices" class="panel-actions"></div>
          <div id="greeting-tools" class="panel-actions greeting-tools">
            <button type="button" class="control" data-greeting="help">幫助</button>
            <button type="button" class="control" data-greeting="again">再看一次</button>
          </div>
          <div id="greeting-help-panel" hidden>
            <p id="greeting-help" class="panel-text"></p>
            <button type="button" class="control" data-greeting="close-help">關閉幫助</button>
          </div>
        </div>
      </section>

      <div
        id="movement-pad"
        class="movement-pad"
        role="group"
        aria-label="全方向移動搖桿"
        aria-describedby="joystick-help"
        hidden
      >
        <span class="pad-ring" aria-hidden="true"></span>
        <span class="pad-thumb" aria-hidden="true"></span>
      </div>
      <p id="joystick-help" class="visually-hidden">
        按住或拖曳圓盤向任意方向移動，放開停止。也可以展開設定使用單次移動按鈕。
      </p>

      <p id="performance-info" class="performance-info" hidden>測量中…</p>

      <p id="npc-info" class="npc-info" hidden>公園裡有小安、小宇、小晴和媽媽。</p>

      <details id="movement-controls" class="movement-controls" hidden>
        <summary class="control" aria-label="操作與設定">設定</summary>
        <div class="movement-content">
          <label class="movement-setting"
            ><input id="npc-motion" type="checkbox" checked />人物動作</label
          >
          <p id="movement-help">
            點地面前往，拖曳看向。左下搖桿：按住或拖向任意方向移動，放開停止。電腦可先點公園，再用
            WASD 或方向鍵。
          </p>
          <div class="movement-buttons" role="group" aria-label="移動與看向">
            <button type="button" class="control" data-move="left">往左一步</button>
            <button type="button" class="control" data-move="right">往右一步</button>
            <button type="button" class="control" data-move="forward">往前一步</button>
            <button type="button" class="control" data-move="back">往後一步</button>
            <button type="button" class="control" data-move="turn-left">向左看</button>
            <button type="button" class="control" data-move="turn-right">向右看</button>
            <button type="button" class="control" data-move="stop">停止移動</button>
          </div>
          <label class="movement-setting"
            ><span
              ><input id="performance-check" type="checkbox" />顯示流暢度數字（FPS）</span
            ></label
          >
          <label class="movement-setting"
            >場景細節
            <select id="environment-detail" name="environment-detail">
              <option value="standard">標準</option>
              <option value="low">較少葉片</option>
            </select>
          </label>
          <label class="movement-setting"
            >移動速度（慢 → 快）<input
              type="range"
              name="speed"
              min="0.6"
              max="1.8"
              step="0.2"
              value="1"
          /></label>
          <label class="movement-setting"
            >轉向靈敏度（低 → 高）<input
              type="range"
              name="sensitivity"
              min="0.001"
              max="0.005"
              step="0.001"
              value="0.002"
          /></label>
          <label class="movement-setting"
            >視野（窄 → 廣）<input type="range" name="fov" min="50" max="75" step="5" value="60"
          /></label>
        </div>
      </details>

      <noscript>
        <p class="panel">這個練習需要開啟 JavaScript。</p>
      </noscript>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
