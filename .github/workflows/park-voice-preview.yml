name: Park voice preview

on:
  workflow_dispatch:
    inputs:
      scope:
        description: 'dry-run 不呼叫 API；first/all 僅在已確認免費配額時使用；first 每次 1 個音檔'
        type: choice
        options: [dry-run, first, all]
        default: dry-run
      voice:
        description: 'Sadaltager 試升高 2.5 半音；Zephyr 保留已選定的小女生設定'
        type: choice
        options: [Zephyr, Sadaltager, Puck, Charon, Kore]
        default: Zephyr
      style:
        description: 'A 自然版或 B 溫和慢速；每次只產生所選版本，first 僅 1 個音檔'
        type: choice
        options: [A, B]
        default: A
      free_quota_confirmed:
        description: '已確認此金鑰專案可使用免費 TTS 配額（此選項不會替供應商設定計費上限）'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: park-voice-preview
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check transcript without API calls
        if: ${{ inputs.scope == 'dry-run' }}
        env:
          PREVIEW_VOICE: ${{ inputs.voice || 'Zephyr' }}
        run: python3 tools/park-voice-preview/generate.py --dry-run --voice "$PREVIEW_VOICE"
      - name: Require free quota confirmation
        if: ${{ inputs.scope != 'dry-run' && !inputs.free_quota_confirmed }}
        run: |
          echo '請先確認免費 TTS 配額；本次未呼叫 API。'
          exit 1
      - name: Generate preview audio
        # Fail before any paid API call if the offline processor is unavailable.
        if: ${{ inputs.scope != 'dry-run' && inputs.free_quota_confirmed }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PREVIEW_SCOPE: ${{ inputs.scope }}
          PREVIEW_STYLE: ${{ inputs.style || 'A' }}
          PREVIEW_VOICE: ${{ inputs.voice || 'Zephyr' }}
        run: |
          if [ "$PREVIEW_VOICE" = 'Zephyr' ] || [ "$PREVIEW_VOICE" = 'Sadaltager' ]; then
            command -v ffmpeg > /dev/null || { echo '需要 ffmpeg，尚未呼叫 API。'; exit 1; }
            ffmpeg -hide_banner -filters 2>/dev/null | grep 'rubberband' > /dev/null || { echo '需要 rubberband 濾鏡，尚未呼叫 API。'; exit 1; }
          fi
          if [ "$PREVIEW_SCOPE" = 'all' ]; then
            python3 tools/park-voice-preview/generate.py --voice "$PREVIEW_VOICE" --style "$PREVIEW_STYLE"
          else
            python3 tools/park-voice-preview/generate.py --line 01 --voice "$PREVIEW_VOICE" --style "$PREVIEW_STYLE"
          fi
      - name: Apply selected voice profile
        if: ${{ !cancelled() && inputs.scope != 'dry-run' && inputs.free_quota_confirmed && (inputs.voice == 'Zephyr' || inputs.voice == 'Sadaltager') }}
        env:
          PREVIEW_VOICE: ${{ inputs.voice }}
        run: |
          if compgen -G 'tools/park-voice-preview/audio/*.wav' > /dev/null; then
            mv tools/park-voice-preview/audio tools/park-voice-preview/raw-audio
            profile='tools/park-voice-preview/voice-profile.json'
            if [ "$PREVIEW_VOICE" = 'Sadaltager' ]; then
              profile='tools/park-voice-preview/sadaltager-higher.json'
            fi
            python3 tools/park-voice-preview/apply_profile.py --input-dir tools/park-voice-preview/raw-audio --output-dir tools/park-voice-preview/audio --profile "$profile"
          fi
      - name: Upload audio and transcript
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: park-voice-preview-${{ github.run_number }}
          path: |
            tools/park-voice-preview/audio/*.wav
            tools/park-voice-preview/audio/*.profile.json
            tools/park-voice-preview/raw-audio/*.wav
            tools/park-voice-preview/lines.json
          retention-days: 14
      - name: Download instructions
        if: ${{ !cancelled() }}
        run: |
          echo '## 公園打招呼語音試聽' >> "$GITHUB_STEP_SUMMARY"
          echo 'dry-run 只檢查台詞，不產生音檔。生成模式請確認 Generate preview audio 成功，再下載下方 Artifacts。' >> "$GITHUB_STEP_SUMMARY"
          echo 'A 自然聊天；B 溫和慢速。音檔保留 14 天，請下載保存。' >> "$GITHUB_STEP_SUMMARY"
          echo 'Zephyr：語速 85%、升高 2.5 半音。Sadaltager：原語速、升高 2.5 半音。raw-audio 保留原音。' >> "$GITHUB_STEP_SUMMARY"
