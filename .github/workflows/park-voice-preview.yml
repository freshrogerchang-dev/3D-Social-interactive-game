name: Park voice preview

on:
  workflow_dispatch:
    inputs:
      scope:
        description: 'dry-run 不呼叫 API；first/all 僅在已確認免費配額時使用；first 每次 1 個音檔'
        type: choice
        options: [dry-run, first, all]
        default: dry-run
      voice:
        description: '聲線候選：Puck 先試小男孩方向；Kore 為原版。年齡與性別聽感須試聽確認'
        type: choice
        options: [Puck, Charon, Kore]
        default: Puck
      style:
        description: 'A 自然版或 B 溫和慢速；每次只產生所選版本，first 僅 1 個音檔'
        type: choice
        options: [A, B]
        default: A
      free_quota_confirmed:
        description: '已確認此金鑰專案可使用免費 TTS 配額（此選項不會替供應商設定計費上限）'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: park-voice-preview
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check transcript without API calls
        if: ${{ inputs.scope == 'dry-run' }}
        env:
          PREVIEW_VOICE: ${{ inputs.voice || 'Puck' }}
        run: python3 tools/park-voice-preview/generate.py --dry-run --voice "$PREVIEW_VOICE"
      - name: Require free quota confirmation
        if: ${{ inputs.scope != 'dry-run' && !inputs.free_quota_confirmed }}
        run: |
          echo '請先確認免費 TTS 配額；本次未呼叫 API。'
          exit 1
      - name: Generate preview audio
        if: ${{ inputs.scope != 'dry-run' && inputs.free_quota_confirmed }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PREVIEW_SCOPE: ${{ inputs.scope }}
          PREVIEW_STYLE: ${{ inputs.style || 'A' }}
          PREVIEW_VOICE: ${{ inputs.voice || 'Puck' }}
        run: |
          if [ "$PREVIEW_SCOPE" = 'all' ]; then
            python3 tools/park-voice-preview/generate.py --voice "$PREVIEW_VOICE" --style "$PREVIEW_STYLE"
          else
            python3 tools/park-voice-preview/generate.py --line 01 --voice "$PREVIEW_VOICE" --style "$PREVIEW_STYLE"
          fi
      - name: Upload audio and transcript
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: park-voice-preview-${{ github.run_number }}
          path: |
            tools/park-voice-preview/audio/*.wav
            tools/park-voice-preview/lines.json
          retention-days: 14
      - name: Download instructions
        if: ${{ !cancelled() }}
        run: |
          echo '## 公園打招呼語音試聽' >> "$GITHUB_STEP_SUMMARY"
          echo 'dry-run 只檢查台詞，不產生音檔。生成模式請確認 Generate preview audio 成功，再下載下方 Artifacts。' >> "$GITHUB_STEP_SUMMARY"
          echo 'A 自然聊天；B 溫和慢速。音檔保留 14 天，請下載保存。' >> "$GITHUB_STEP_SUMMARY"
