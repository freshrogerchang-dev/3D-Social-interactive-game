# 發布 S4 骨架到 GitHub Pages：push 到 main-uv12jr 時自動執行，檢查通過才發布。
# 手動觸發（workflow_dispatch）只有在此檔也存在於預設分支時才會出現。
# 需要的 repo 設定：Settings → Pages → Source 選 GitHub Actions；
# Settings → Environments → github-pages 允許發布的分支（main-uv12jr）。
name: Deploy to GitHub Pages

on:
  push:
    branches: [main-uv12jr]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      # Pages 網址有 repo 名稱的子路徑，build 時指定 base。
      - run: npx vite build --base=/${{ github.event.repository.name }}/
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
